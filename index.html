<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handelsgaden - Iværksætterspillet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }

        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 28px;
            width: 28px;
            border-radius: 50%;
            background: #059669;
            border: 3px solid #ffffff;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #e2e8f0;
            border-radius: 999px;
        }
        input[type=range].price-slider::-webkit-slider-thumb {
            background: #d97706;
            box-shadow: 0 4px 10px rgba(217, 119, 6, 0.4);
        }

        .scene {
            width: 96px;
            height: 96px;
            perspective: 500px;
        }
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.25s cubic-bezier(0.2, 0.85, 0.3, 1.1);
        }
        .cube__face {
            position: absolute;
            width: 96px;
            height: 96px;
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            border: 3px solid #cbd5e1;
            border-radius: 18px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 14px;
            box-shadow: inset 0 0 14px rgba(0,0,0,0.08), 0 10px 25px rgba(0,0,0,0.15);
        }

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }

        /* Tactile Custom Range Sliders */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 28px;
            width: 28px;
            border-radius: 50%;
            background: #059669;
            border: 3px solid #ffffff;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #e2e8f0;
            border-radius: 999px;
        }
        input[type=range].price-slider::-webkit-slider-thumb {
            background: #d97706;
            box-shadow: 0 4px 10px rgba(217, 119, 6, 0.4);
        }

        /* 3D Dice Styling */
        .scene {
            width: 96px;
            height: 96px;
            perspective: 500px;
        }
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.25s cubic-bezier(0.2, 0.85, 0.3, 1.1);
        }
        .cube__face {
            position: absolute;
            width: 96px;
            height: 96px;
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            border: 3px solid #cbd5e1;
            border-radius: 18px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 14px;
            box-shadow: inset 0 0 14px rgba(0,0,0,0.08), 0 10px 25px rgba(0,0,0,0.15);
        }
        .pip {
            width: 16px;
            height: 16px;
            background-color: #0f172a;
            border-radius: 50%;
            align-self: center;
            justify-self: center;
        }
        .cube__face--1 .pip { background-color: #e11d48; width: 20px; height: 20px; }
        .cube__face--1 { transform: rotateY(0deg) translateZ(48px); }
        .cube__face--2 { transform: rotateY(90deg) translateZ(48px); }
        .cube__face--3 { transform: rotateY(180deg) translateZ(48px); }
        .cube__face--4 { transform: rotateY(-90deg) translateZ(48px); }
        .cube__face--5 { transform: rotateX(90deg) translateZ(48px); }
        .cube__face--6 { transform: rotateX(-90deg) translateZ(48px); }

        /* Awning Stripes for Storefronts */
        .awning-stripes {
            background-image: repeating-linear-gradient(
                90deg,
                rgba(255,255,255,0.28) 0px,
                rgba(255,255,255,0.28) 14px,
                transparent 14px,
                transparent 28px
            );
        }

        @keyframes popIn {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
